services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      APP_ENV: "${APP_ENV:-development}"
      DEMO_MODE: "${DEMO_MODE:-true}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:///data/legal_intake.db}"
      APP_SECRET: "${APP_SECRET:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_INTAKE_MODEL: "${OPENAI_INTAKE_MODEL:-gpt-5.6-terra}"
      OPENAI_DIAGNOSIS_MODEL: "${OPENAI_DIAGNOSIS_MODEL:-gpt-5.6-sol}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash-lite}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      ATICO34_KNOWLEDGE_PATH: "${ATICO34_KNOWLEDGE_PATH:-docs/atico34_knowledge.md}"
      TIMEZONE: "${TIMEZONE:-Europe/Madrid}"
